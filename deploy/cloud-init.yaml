#cloud-config
# Server setup for the Triangle Rowing Club website on Hetzner Cloud.
# Paste this whole file into "Cloud config" when creating the server
# (Debian 13). See docs/operations.md.
#
# Result: Caddy serving /srv/trc/site over HTTPS, a "deploy" user that GitHub
# Actions uses to upload the site, SSH by key only, only ports 22/80/443 open,
# and security updates installed automatically.

package_update: true
package_upgrade: true
packages:
  - caddy
  - rsync
  - ufw
  - unattended-upgrades

users:
  - default
  - name: deploy
    gecos: Website deploy (GitHub Actions)
    shell: /bin/bash
    lock_passwd: true
    ssh_authorized_keys:
      # Public half of the deploy key; the private half is the
      # DEPLOY_SSH_KEY secret in the trianglerowing/website GitHub repository.
      - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIH2hw/2n37xb6haYeWYMKZ8edcetukmSJPOAmPgt1/4Z deploy@github-actions"

write_files:
  - path: /etc/ssh/sshd_config.d/10-trc-hardening.conf
    permissions: "0644"
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin prohibit-password

  - path: /etc/apt/apt.conf.d/20auto-upgrades
    permissions: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

  # The deploy user may reload the web server (to pick up new redirects) and
  # nothing else as root.
  - path: /etc/sudoers.d/deploy-caddy
    permissions: "0440"
    content: |
      deploy ALL=(root) NOPASSWD: /usr/bin/systemctl reload caddy

  # Web server configuration. Root-owned on purpose: this server may also run
  # other club services (for example a password vault), so the website's
  # deploy key must never be able to change how any site is served. Each
  # service gets its own file in /etc/caddy/sites/. Written after packages
  # install so the caddy package does not replace it.
  - path: /etc/caddy/Caddyfile
    permissions: "0644"
    defer: true
    content: |
      import /etc/caddy/sites/*.caddy

  # The website. To change it on a running server, edit this file as root
  # and run "systemctl reload caddy"; make the same change here by pull
  # request so a rebuilt server matches.
  - path: /etc/caddy/sites/trc-website.caddy
    permissions: "0644"
    defer: true
    content: |
      dev.trianglerowing.org {
      	root * /srv/trc/site
      	encode zstd gzip

      	# Old SportsEngine addresses -> new pages (301), generated from
      	# data/redirects.yaml and uploaded by the deploy job. Imported inside
      	# this site only, so it cannot affect any other service.
      	import /srv/trc/redirects.caddy

      	header {
      		# Development site: keep it out of search engines until launch.
      		X-Robots-Tag "noindex, nofollow"
      		Strict-Transport-Security "max-age=31536000"
      		X-Content-Type-Options "nosniff"
      		Referrer-Policy "strict-origin-when-cross-origin"
      		-Server
      	}

      	file_server
      }

      # Launch cutover (a separate, planned step; see
      # docs/decisions/0001-platform-and-hosting.md): change the site address
      # above to "trianglerowing.org, www.trianglerowing.org", delete the
      # X-Robots-Tag line, and set params.noindex = false in hugo.toml. Until
      # then trianglerowing.org and www stay on SportsEngine.

runcmd:
  - [mkdir, -p, /srv/trc/site]
  - [touch, /srv/trc/redirects.caddy]
  - [chown, -R, "deploy:deploy", /srv/trc]
  - [ufw, default, deny, incoming]
  - [ufw, default, allow, outgoing]
  - [ufw, allow, 22/tcp]
  - [ufw, allow, 80/tcp]
  - [ufw, allow, 443/tcp]
  - [ufw, --force, enable]
  - [systemctl, reload, ssh]
  - [systemctl, restart, caddy]
