name: Kees Koopman
role: Head Coach, Varsity Men
weight: 20
bio: |-
  Kees grew up in Raleigh and started rowing with TRC in 2016 after a Learn to Row camp. He rowed for the club through high school and earned degrees in linguistics and anthropology from NC State. While in college he began coaching at TRC, leading summer camps and year-round squads, including Middle School Girls and Novice and U17 Women. His crews have won medals at Head of the Hooch and Southeast Regionals and set team bests at Head of the Charles and the Youth National Championships. He values team culture and steady effort. Kees also runs the Learn to Row camps.
