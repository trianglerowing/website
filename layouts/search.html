{{ define "main" }}
<article class="prose">
  <h1>{{ .Title }}</h1>
  <label class="search-label" for="site-search-input">Search the Triangle Rowing Club website</label>
  <div id="search" data-pagefind-ignore></div>
  <noscript><p>Search needs JavaScript. You can find pages through the menu at the top.</p></noscript>
</article>
<link rel="stylesheet" href="/pagefind/pagefind-ui.css">
<script src="/pagefind/pagefind-ui.js"></script>
<script>
  window.addEventListener("DOMContentLoaded", function () {
    var ui = new PagefindUI({ element: "#search", showImages: false, resetStyles: false });
    var input = document.querySelector("#search .pagefind-ui__search-input");
    if (input) { input.id = "site-search-input"; }
    var q = new URLSearchParams(window.location.search).get("q");
    if (q) { ui.triggerSearch(q); }
  });
</script>
{{ end }}
