# Website editor (Sveltia CMS) configuration.
# Editors sign in at /admin with a GitHub account that belongs to the club's
# GitHub organization. Saving an entry commits it to the main branch and the
# site rebuilds.
#
# Sign-in: GitHub sign-in needs a small authentication helper (an OAuth
# client). It is set up with the server and deploy work; until then editors
# can sign in with a GitHub personal access token.

backend:
  name: github
  repo: trianglerowing/website
  branch: main
  # base_url: https://dev.trianglerowing.org   # authentication helper, added with the server work

media_folder: static/images/uploads
public_folder: /images/uploads

site_url: https://dev.trianglerowing.org
display_url: https://dev.trianglerowing.org
logo_url: /favicon.ico

slug:
  encoding: ascii
  clean_accents: true

collections:
  - name: pages
    label: Pages
    label_singular: Page
    description: "Every page on the site, arranged as it appears in the address bar. Each page can hold pages beneath it. New to editing? Read the editor guide: https://github.com/trianglerowing/website/blob/main/docs/editor-guide.md"
    folder: content/pages
    create: true
    nested:
      depth: 4
      summary: "{{title}}"
    meta:
      path:
        widget: string
        label: Address
        index_file: _index
    path: "{{slug}}/_index"
    fields:
      - { name: title, label: Title, widget: string }
      - { name: menu_title, label: Short title for the menu, widget: string, required: false }
      - { name: description, label: Summary (one sentence for search engines and page lists), widget: string, required: false }
      - { name: show_in_menu, label: Show in the main menu, widget: boolean, default: false }
      - { name: weight, label: Order (lower numbers first), widget: number, value_type: int, default: 50 }
      - { name: body, label: Page text, widget: markdown }

  - name: news
    label: News
    label_singular: News post
    description: "New to editing? Read the editor guide: https://github.com/trianglerowing/website/blob/main/docs/editor-guide.md"
    folder: content/news
    create: true
    path: "{{year}}/{{slug}}"
    sortable_fields: [date, title]
    fields:
      - { name: title, label: Title, widget: string }
      - { name: date, label: Date, widget: datetime }
      - { name: description, label: Summary, widget: string, required: false }
      - { name: image, label: Photo (no identifiable minors without consent), widget: image, required: false }
      - { name: body, label: Post, widget: markdown }

  - name: coaches
    label: Coaches
    label_singular: Coach
    description: "New to editing? Read the editor guide: https://github.com/trianglerowing/website/blob/main/docs/editor-guide.md"
    folder: data/coaches
    format: yaml
    extension: yaml
    create: true
    identifier_field: name
    fields:
      - { name: name, label: Name, widget: string }
      - { name: role, label: Role, widget: string }
      - { name: weight, label: Order (lower numbers first), widget: number, value_type: int, default: 50 }
      - { name: photo, label: Photo, widget: image, required: false }
      - { name: bio, label: Biography, widget: markdown, required: false }

  - name: board
    label: Board members
    label_singular: Board member
    description: "Shown on the About, Board page. Use club role email addresses, never personal phone numbers or home addresses. New to editing? Read the editor guide: https://github.com/trianglerowing/website/blob/main/docs/editor-guide.md"
    folder: data/board
    format: yaml
    extension: yaml
    create: true
    identifier_field: name
    fields:
      - { name: name, label: Name, widget: string }
      - { name: role, label: Role (for example Treasurer), widget: string }
      - { name: email, label: Club role email address, widget: string, required: false }
      - { name: weight, label: Order (lower numbers first), widget: number, value_type: int, default: 50 }

  - name: sponsors
    label: Sponsors
    label_singular: Sponsor
    description: "New to editing? Read the editor guide: https://github.com/trianglerowing/website/blob/main/docs/editor-guide.md"
    folder: data/sponsors
    format: yaml
    extension: yaml
    create: true
    identifier_field: name
    fields:
      - { name: name, label: Name, widget: string }
      - { name: level, label: Level, widget: select, options: [Platinum, Gold, Silver Oar, Bronze Oar, Supporter] }
      - { name: note, label: Sponsor role (for example Official Restaurant Sponsor), widget: string, required: false }
      - { name: url, label: Website, widget: string, required: false }
      - { name: logo, label: Logo, widget: image, required: false }

  - name: club
    label: Club settings
    description: "New to editing? Read the editor guide: https://github.com/trianglerowing/website/blob/main/docs/editor-guide.md"
    files:
      - name: settings
        label: Registration, donations and season
        file: data/settings.yaml
        format: yaml
        fields:
          - { name: season_label, label: Current season, widget: string }
          - name: seasons
            label: Season windows
            widget: object
            fields:
              - { name: fall, label: Fall season, widget: string }
              - { name: spring, label: Spring season, widget: string }
          - name: fees
            label: Fees (printed on program pages)
            widget: object
            fields:
              - { name: high_school_dues, label: High school season dues, widget: string }
              - { name: middle_school_dues, label: Middle school season dues, widget: string }
              - { name: off_season_high_school, label: High school off-season dues range, widget: string }
              - { name: off_season_middle_school, label: Middle school off-season dues range, widget: string }
              - { name: summer_training_high_school, label: High school summer training, per session, widget: string }
              - { name: summer_training_middle_school, label: Middle school summer training, per session, widget: string }
              - { name: sneak_peek_week, label: Sneak Peek Week fee, widget: string }
              - { name: learn_to_row_per_week, label: Learn to Row, per week, widget: string }
              - { name: learn_to_row_session_change, label: Learn to Row session change fee, widget: string }
              - { name: learn_to_row_cancellation, label: Learn to Row cancellation fee, widget: string }
              - { name: volunteer_opt_out, label: Volunteer opt-out fee, widget: string }
          - name: volunteer
            label: Volunteer requirement
            widget: object
            fields:
              - { name: tokens_per_high_school_rower, label: Volunteer tokens per high school rower, widget: string }
          - name: dates
            label: Dates and deadlines
            widget: object
            fields:
              - { name: sneak_peek_week, label: Sneak Peek Week dates, widget: string }
              - { name: learn_to_row_sessions, label: Learn to Row session dates, widget: string }
              - { name: tuition_reduction_returning_deadline, label: Tuition reduction deadline, returning families, widget: string }
              - { name: tuition_reduction_new_deadline, label: Tuition reduction deadline, new families, widget: string }
              - { name: erg_a_thon, label: Erg-A-Thon date, widget: string }
          - name: fundraising
            label: Fundraising figures and links
            widget: object
            fields:
              - { name: erg_a_thon_goal, label: Erg-A-Thon goal, widget: string }
              - { name: erg_a_thon_url, label: Erg-A-Thon donation link, widget: string }
              - { name: sustainer_goal_per_rower_per_month, label: Monthly giving goal per rower per month, widget: string }
              - { name: sustainer_annual_goal, label: Monthly giving yearly goal, widget: string }
          - name: links
            label: Other links
            widget: object
            fields:
              - { name: member_login, label: Family sign-in link (SportsEngine), widget: string, pattern: ['^https://[a-z0-9-]+\.sportngin\.com/', 'Must be a SportsEngine link on sportngin.com'] }
              - { name: tuition_reduction_application, label: Tuition reduction application form link, widget: string }
          - name: donate
            label: Donate button
            widget: object
            fields:
              - { name: label, label: Button text, widget: string }
              - { name: url, label: Donation link, widget: string }
          - name: calendar
            label: Calendar
            widget: object
            fields:
              - { name: url, label: Calendar page link, widget: string }
              - name: feeds
                label: Calendar feeds
                label_singular: Calendar feed
                widget: list
                summary: "{{label}}"
                fields:
                  - { name: name, label: Short name (used for the data file, letters and dashes), widget: string, pattern: ['^[a-z0-9-]+$', 'Lowercase letters, numbers and dashes only'] }
                  - { name: label, label: Calendar name shown on the page, widget: string }
                  - { name: ical_url, label: iCal feed link (read when the site is built), widget: string }
                  - { name: subscribe_url, label: Subscribe link shown to families, widget: string }
          - name: registration
            label: Registration links
            label_singular: Program
            widget: list
            summary: "{{label}} (open: {{open}})"
            fields:
              - { name: key, label: Short name used in pages, widget: string }
              - { name: label, label: Button text, widget: string }
              - { name: url, label: SportsEngine form link, widget: string, pattern: ['^https://[a-z0-9-]+\.sportngin\.com/', 'Must be a SportsEngine link on sportngin.com'] }
              - { name: open, label: Registration open, widget: boolean }
      - name: glossary
        label: Rowing glossary
        file: data/glossary.yaml
        format: yaml
        fields:
          - name: terms
            label: Terms
            label_singular: Term
            widget: list
            summary: "{{term}}"
            fields:
              - { name: term, label: Term, widget: string }
              - { name: definition, label: Definition, widget: text }
