name: Build site

on:
  push:
    branches: [main]
  schedule:
    # Nightly rebuild so calendar events stay current without edits.
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  HUGO_VERSION: "0.169.0"
  HUGO_SHA256: "c41672a0725d307758a132bc94a962e59760eb33f9ba08c991b81f9881d6fa7d"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Hugo extended
        run: |
          url="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/hugo.tar.gz" "$url"
          echo "${HUGO_SHA256}  $RUNNER_TEMP/hugo.tar.gz" | sha256sum --check -
          mkdir -p "$RUNNER_TEMP/hugo"
          tar -xzf "$RUNNER_TEMP/hugo.tar.gz" -C "$RUNNER_TEMP/hugo" hugo
          echo "$RUNNER_TEMP/hugo" >> "$GITHUB_PATH"

      # Exits 0 even when a feed is unreachable; the committed data/events
      # files then stay as the last good copy.
      - name: Convert calendar feeds
        run: python3 scripts/ical-to-json

      - name: Build site
        run: hugo --minify --panicOnWarning

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: site
          path: public/

  # TODO(Pace work package 2493, https://pace.demar.co/work_packages/2493):
  # deploy job goes here. It downloads the "site" artifact from the build job
  # and publishes it to the server. Do not deploy from the build job.
