# Season-dependent values, edited in the website editor under "Club settings".
# Pages read these, so one change here updates every page that uses them.
# Registration, payments and rosters stay on SportsEngine: these are links
# to SportsEngine forms on its own hostname, never a trianglerowing.org path.

season_label: "TODO(board): current season name, for example Spring 2027"

# Season windows used in program descriptions.
seasons:
  fall: "mid-August to early November"
  spring: "mid-February to mid-May"

# Fees. Pages print these with the setting shortcode, so one edit here updates
# every page. Dues are the most recent season's figures; check them each season.
fees:
  high_school_dues: "$1,695"
  middle_school_dues: "$525"
  off_season_high_school: "$165 to $275"
  off_season_middle_school: "$180 to $250"
  summer_training_high_school: "$230"
  summer_training_middle_school: "$175"
  sneak_peek_week: "$10"
  learn_to_row_per_week: "$285"
  learn_to_row_session_change: "$25"
  learn_to_row_cancellation: "$50"
  volunteer_opt_out: "$800"

# Volunteer requirement. The old site said both 40 and 20 tokens per high school rower.
volunteer:
  tokens_per_high_school_rower: "TODO(board): how many volunteer tokens does each high school rower's family owe per season? The old volunteering page said both 40 and 20."

# Dates that change each season.
dates:
  sneak_peek_week: "TODO(board): fall Sneak Peek Week dates for the next season (the old page showed August and September 2026, which have passed)"
  learn_to_row_sessions: "TODO(board): Learn to Row session dates for summer 2027 (the old page showed 2026 sessions, which have passed)"
  tuition_reduction_returning_deadline: "TODO(board): deadline for returning families to apply for tuition reduction (the old page gave August 17 with no year)"
  tuition_reduction_new_deadline: "TODO(board): deadline for new families to apply for tuition reduction (the old page gave September 6 with no year)"
  erg_a_thon: "TODO(board): Erg-A-Thon date"

fundraising:
  erg_a_thon_goal: "$50,000"
  erg_a_thon_url: "https://givebutter.com/c/erg-a-thon2026"
  sustainer_goal_per_rower_per_month: "$25"
  sustainer_annual_goal: "$30,000"

links:
  # Sign-in for families. SportsEngine redirects this to its own sign-in page.
  member_login: "https://triangle-rowing-club.sportngin.com/login"
  tuition_reduction_application: "https://docs.google.com/forms/d/e/1FAIpQLScDuYG1ujOkeKAMotelMWkY8t8br00qPWqc4Tp9b3xL4Y5sOg/viewform?usp=dialog"

donate:
  label: "Donate"
  url: "https://givebutter.com/triangle-rowing-club"

calendar:
  # SportsEngine calendar page.
  url: "https://www.trianglerowing.org/page/show/7282304-calendar"
  # iCal feeds read by scripts/ical-to-json into data/events/<name>.json.
  # ical_url is fetched at build time; subscribe_url is the link families use
  # to add the calendar to their phones.
  feeds:
    - name: general
      label: "General"
      ical_url: "https://calendar.google.com/calendar/ical/c_nmsbq2qoae8u535rssh958v54k%40group.calendar.google.com/public/basic.ics"
      subscribe_url: "https://calendar.google.com/calendar/u/0?cid=Y19ubXNicTJxb2FlOHU1MzVyc3NoOTU4djU0a0Bncm91cC5jYWxlbmRhci5nb29nbGUuY29t"
    - name: high-school
      label: "High School"
      ical_url: "https://calendar.google.com/calendar/ical/c_52da1v0i8ipfbtlu2vklagkfcg%40group.calendar.google.com/public/basic.ics"
      subscribe_url: "https://calendar.google.com/calendar/u/0?cid=Y181MmRhMXYwaThpcGZidGx1MnZrbGFna2ZjZ0Bncm91cC5jYWxlbmRhci5nb29nbGUuY29t"
    - name: middle-school-boys
      label: "Middle School Boys"
      ical_url: "https://calendar.google.com/calendar/ical/c_4agdb0ldcopa3k4tqq18vmivrk%40group.calendar.google.com/public/basic.ics"
      subscribe_url: "https://calendar.google.com/calendar/u/0?cid=Y180YWdkYjBsZGNvcGEzazR0cXExOHZtaXZya0Bncm91cC5jYWxlbmRhci5nb29nbGUuY29t"
    - name: middle-school-girls
      label: "Middle School Girls"
      ical_url: "https://calendar.google.com/calendar/ical/c_h139433dmrsog3o9uruhplf4hc%40group.calendar.google.com/public/basic.ics"
      subscribe_url: "https://calendar.google.com/calendar/u/0?cid=Y19oMTM5NDMzZG1yc29nM285dXJ1aHBsZjRoY0Bncm91cC5jYWxlbmRhci5nb29nbGUuY29t"

