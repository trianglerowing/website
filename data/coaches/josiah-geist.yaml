name: Josiah Geist
role: Head Coach, Development
weight: 30
bio: |-
  Josiah started rowing in ninth grade and has been with TRC as an athlete or coach since 2013. He studied economics at NC State and holds a master's in teaching from UNC Chapel Hill. He taught fourth and seventh grade for three years in Wake County public schools. He enjoys helping new athletes learn to move a boat and is proud of his part in the club's growth.
