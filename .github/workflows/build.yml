name: Build site

on:
  push:
    branches: [main]
  # Build every pull request too, so a broken change shows red before merge.
  # The deploy job below never runs for pull requests.
  pull_request:
  schedule:
    # Nightly rebuild so calendar events stay current without edits.
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  HUGO_VERSION: "0.169.0"
  HUGO_SHA256: "c41672a0725d307758a132bc94a962e59760eb33f9ba08c991b81f9881d6fa7d"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Hugo extended
        run: |
          url="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/hugo.tar.gz" "$url"
          echo "${HUGO_SHA256}  $RUNNER_TEMP/hugo.tar.gz" | sha256sum --check -
          mkdir -p "$RUNNER_TEMP/hugo"
          tar -xzf "$RUNNER_TEMP/hugo.tar.gz" -C "$RUNNER_TEMP/hugo" hugo
          echo "$RUNNER_TEMP/hugo" >> "$GITHUB_PATH"

      # Exits 0 even when a feed is unreachable; the committed data/events
      # files then stay as the last good copy.
      - name: Convert calendar feeds
        run: python3 scripts/ical-to-json

      - name: Build site
        run: hugo --minify --panicOnWarning

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: site
          path: public/

  # Publishes the built site to the club's Hetzner server (docs/operations.md).
  # Runs only for main, and only once the server settings exist:
  #   variable DEPLOY_HOST          server address (Settings > Secrets and variables > Actions > Variables)
  #   secret   DEPLOY_SSH_KEY       private key whose public half is in deploy/cloud-init.yaml
  #   secret   DEPLOY_KNOWN_HOSTS   the server's SSH host keys, so the job refuses an impostor
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_HOST != ''
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: site
          path: public

      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      # The redirect list may hold only comments and "redir" lines, so a bad
      # merge cannot slip other web server directives into the site.
      - name: Check redirect list
        run: |
          if grep -vE '^(#.*|redir /[^ ]* /[^ ]* 301)?$' public/redirects.caddy; then
            echo "redirects.caddy contains lines other than redirects" >&2
            exit 1
          fi

      # The web server's own configuration is root-owned on the server and is
      # not touched here (see deploy/cloud-init.yaml).
      - name: Upload site and redirects
        env:
          HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          ssh_cmd="ssh -i $HOME/.ssh/deploy -o StrictHostKeyChecking=yes -o BatchMode=yes"
          rsync -rlz --delete --exclude /redirects.caddy -e "$ssh_cmd" public/ "deploy@$HOST:/srv/trc/site/"
          rsync -z -e "$ssh_cmd" public/redirects.caddy "deploy@$HOST:/srv/trc/redirects.caddy"
          $ssh_cmd "deploy@$HOST" sudo /usr/bin/systemctl reload caddy
