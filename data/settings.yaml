# Season-dependent values, edited in the website editor under "Club settings".
# Pages read these, so one change here updates every page that uses them.
# Registration, payments and rosters stay on SportsEngine: these are links
# to SportsEngine forms on its own hostname, never a trianglerowing.org path.

season_label: "TODO(board): current season name, for example Spring 2027"

