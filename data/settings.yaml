calendar:
  # SportsEngine calendar page.
  url: "https://www.trianglerowing.org/page/show/7282304-calendar"
  # iCal feeds read by scripts/ical-to-json into data/events/<name>.json.
  # ical_url is fetched at build time; subscribe_url is the link families use
  # to add the calendar to their phones.
  feeds:
